<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="360" viewBox="0 0 1500 360">
  <defs>
    <style>
      .title { font-family: 'Times New Roman', serif; font-size: 30px; font-weight: 700; fill: #111827; }
      .text { font-family: 'Times New Roman', serif; font-size: 22px; fill: #111827; }
      .box { stroke: #374151; stroke-width: 2.2; rx: 12; ry: 12; }
      .arrow { stroke: #374151; stroke-width: 2.8; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#374151" />
    </marker>
  </defs>
  <rect width="1500" height="360" fill="#ffffff" />

  <rect class="box" x="50" y="130" width="160" height="100" fill="#dbeafe" />
  <text x="130" y="170" text-anchor="middle" class="title">Ảnh đầu vào</text>
  <text x="130" y="202" text-anchor="middle" class="text">256 x 256 x 3</text>

  <rect class="box" x="250" y="130" width="210" height="100" fill="#dcfce7" />
  <text x="355" y="170" text-anchor="middle" class="title">VGG19</text>
  <text x="355" y="202" text-anchor="middle" class="text">trích xuất đặc trưng</text>

  <rect class="box" x="500" y="130" width="220" height="100" fill="#fef3c7" />
  <text x="610" y="170" text-anchor="middle" class="title">Gộp trung bình</text>
  <text x="610" y="202" text-anchor="middle" class="text">toàn cục</text>

  <rect class="box" x="760" y="130" width="180" height="100" fill="#e0f2fe" />
  <text x="850" y="170" text-anchor="middle" class="title">Dropout</text>
  <text x="850" y="202" text-anchor="middle" class="text">giảm quá khớp</text>

  <rect class="box" x="980" y="130" width="220" height="100" fill="#ede9fe" />
  <text x="1090" y="170" text-anchor="middle" class="title">Dense 256</text>
  <text x="1090" y="202" text-anchor="middle" class="text">ReLU + Dropout</text>

  <rect class="box" x="1240" y="130" width="210" height="100" fill="#ffe4e6" />
  <text x="1345" y="170" text-anchor="middle" class="title">Softmax</text>
  <text x="1345" y="202" text-anchor="middle" class="text">phân loại 3 nhóm</text>

  <line class="arrow" x1="210" y1="180" x2="250" y2="180" />
  <line class="arrow" x1="460" y1="180" x2="500" y2="180" />
  <line class="arrow" x1="720" y1="180" x2="760" y2="180" />
  <line class="arrow" x1="940" y1="180" x2="980" y2="180" />
  <line class="arrow" x1="1200" y1="180" x2="1240" y2="180" />
</svg>
