<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <style>
      .title { font-family: 'Times New Roman', serif; font-size: 29px; font-weight: 700; fill: #111827; }
      .text { font-family: 'Times New Roman', serif; font-size: 21px; fill: #111827; }
      .box { stroke: #374151; stroke-width: 2.2; rx: 12; ry: 12; }
      .arrow { stroke: #374151; stroke-width: 2.8; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#374151" />
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff" />

  <!-- Hang 1 -->
  <rect class="box" x="70" y="95" width="185" height="100" fill="#dbeafe" />
  <text x="162.5" y="135" text-anchor="middle" class="title">Ảnh gốc</text>
  <text x="162.5" y="168" text-anchor="middle" class="text">X-quang</text>

  <rect class="box" x="325" y="95" width="190" height="100" fill="#dcfce7" />
  <text x="420" y="135" text-anchor="middle" class="title">Đọc ảnh</text>
  <text x="420" y="168" text-anchor="middle" class="text">mức xám</text>

  <rect class="box" x="585" y="95" width="225" height="100" fill="#dcfce7" />
  <text x="697.5" y="135" text-anchor="middle" class="title">Đổi kích thước</text>
  <text x="697.5" y="168" text-anchor="middle" class="text">256 x 256</text>

  <rect class="box" x="880" y="95" width="230" height="100" fill="#fef3c7" />
  <text x="995" y="135" text-anchor="middle" class="title">Tăng tương phản</text>
  <text x="995" y="168" text-anchor="middle" class="text">làm rõ vùng ảnh</text>

  <!-- Hang 2 -->
  <rect class="box" x="205" y="355" width="225" height="100" fill="#fef3c7" />
  <text x="317.5" y="395" text-anchor="middle" class="title">Chuyển ba kênh</text>
  <text x="317.5" y="428" text-anchor="middle" class="text">phù hợp mô hình</text>

  <rect class="box" x="500" y="355" width="220" height="100" fill="#ede9fe" />
  <text x="610" y="395" text-anchor="middle" class="title">Tăng dữ liệu</text>
  <text x="610" y="428" text-anchor="middle" class="text">khi huấn luyện</text>

  <rect class="box" x="790" y="355" width="210" height="100" fill="#ffe4e6" />
  <text x="895" y="395" text-anchor="middle" class="title">Chuẩn hóa</text>
  <text x="895" y="428" text-anchor="middle" class="text">đầu vào</text>

  <!-- Mui ten hang 1 -->
  <line class="arrow" x1="255" y1="145" x2="325" y2="145" />
  <line class="arrow" x1="515" y1="145" x2="585" y2="145" />
  <line class="arrow" x1="810" y1="145" x2="880" y2="145" />

  <!-- Xuong hang va hang 2 -->
  <path class="arrow" d="M 1110 145 H 1150 V 405 H 1000" />
  <line class="arrow" x1="790" y1="405" x2="720" y2="405" />
  <line class="arrow" x1="500" y1="405" x2="430" y2="405" />
</svg>
