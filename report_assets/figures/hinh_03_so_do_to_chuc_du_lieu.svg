<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720">
  <defs>
    <style>
      .label { font-family: 'Times New Roman', serif; font-size: 25px; font-weight: 700; fill: #111827; }
      .text { font-family: 'Times New Roman', serif; font-size: 21px; fill: #111827; }
      .box { stroke: #374151; stroke-width: 2.2; rx: 12; ry: 12; }
      .arrow { stroke: #374151; stroke-width: 2.7; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#374151" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="720" fill="#ffffff" />

  <!-- Nguon anh -->
  <rect class="box" x="80" y="130" width="250" height="100" fill="#dbeafe" />
  <text x="205" y="170" text-anchor="middle" class="label">Nguồn ảnh NIH</text>
  <text x="205" y="202" text-anchor="middle" class="text">Bình thường, tràn dịch</text>

  <rect class="box" x="80" y="430" width="250" height="100" fill="#dbeafe" />
  <text x="205" y="470" text-anchor="middle" class="label">Nguồn ảnh viêm phổi</text>
  <text x="205" y="502" text-anchor="middle" class="text">Ảnh X-quang viêm phổi</text>

  <!-- Tep danh sach -->
  <rect class="box" x="450" y="270" width="260" height="150" fill="#dcfce7" />
  <text x="580" y="326" text-anchor="middle" class="label">Tệp danh sách ảnh</text>
  <text x="580" y="360" text-anchor="middle" class="text">Đường dẫn ảnh</text>
  <text x="580" y="390" text-anchor="middle" class="text">và nhãn tương ứng</text>

  <!-- Chia tap -->
  <rect class="box" x="830" y="90" width="270" height="100" fill="#fef3c7" />
  <text x="965" y="130" text-anchor="middle" class="label">Tập huấn luyện</text>
  <text x="965" y="162" text-anchor="middle" class="text">Tỉ lệ 3 : 1 : 3</text>

  <rect class="box" x="830" y="295" width="270" height="100" fill="#fef3c7" />
  <text x="965" y="335" text-anchor="middle" class="label">Tập kiểm định</text>
  <text x="965" y="367" text-anchor="middle" class="text">Theo dõi huấn luyện</text>

  <rect class="box" x="830" y="500" width="270" height="100" fill="#fef3c7" />
  <text x="965" y="540" text-anchor="middle" class="label">Tập kiểm tra</text>
  <text x="965" y="572" text-anchor="middle" class="text">Đánh giá cuối cùng</text>

  <!-- Luong du lieu va mo hinh -->
  <rect class="box" x="1230" y="270" width="230" height="150" fill="#ede9fe" />
  <text x="1345" y="326" text-anchor="middle" class="label">Luồng dữ liệu</text>
  <text x="1345" y="360" text-anchor="middle" class="text">Tiền xử lý ảnh</text>
  <text x="1345" y="390" text-anchor="middle" class="text">và tạo lượt học</text>

  <rect class="box" x="1230" y="555" width="230" height="95" fill="#ffe4e6" />
  <text x="1345" y="594" text-anchor="middle" class="label">Mô hình phân loại</text>
  <text x="1345" y="626" text-anchor="middle" class="text">Dự đoán ba nhóm ảnh</text>

  <!-- Nguon anh -> tep danh sach: mui ten vuong goc, cham canh khung -->
  <path class="arrow" d="M 330 180 H 390 V 315 H 450" />
  <path class="arrow" d="M 330 480 H 390 V 375 H 450" />

  <!-- Tep danh sach -> cac tap: mui ten vuong goc, cham canh khung -->
  <path class="arrow" d="M 710 315 H 760 V 140 H 830" />
  <path class="arrow" d="M 710 345 H 830" />
  <path class="arrow" d="M 710 375 H 760 V 550 H 830" />

  <!-- Cac tap -> luong du lieu: mui ten vuong goc, cham canh khung -->
  <path class="arrow" d="M 1100 140 H 1165 V 305 H 1230" />
  <path class="arrow" d="M 1100 345 H 1230" />
  <path class="arrow" d="M 1100 550 H 1165 V 385 H 1230" />

  <!-- Luong du lieu -> mo hinh -->
  <path class="arrow" d="M 1345 420 V 555" />
</svg>
